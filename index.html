<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
  </head>
  <body>
    <form action="results.html" method="get">
      <label for="session-length">session length:
        <input type="number" id="session-length" min="2" max="8" step="0.5"></input> hours
      </label>
      <br>
      <label for="player-count">player count:
        <input type="number" id="player-count" min="2" max="6"> players
      </label>
      <br>
      <fieldset>
        <legend>which campaign settings are you interested in?</legend>
        <div id="campaign-setting-checkbox-grid"></div>
      </fieldset>      
    </form>
    <script src="script.js"></script>
  </body>
</html>
