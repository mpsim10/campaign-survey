<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
  </head>
  <body>
    <form action="results.html" method="get" id="survey-form">
      <label for="session-length">session length (hours):
        <input type="number" id="session-length" name="session-length" min="2" max="8" step="0.5" value="6"></input> hours
      </label>
      <br>
      <label for="player-count">player count:
        <input type="number" id="player-count" name="player-count" min="2" max="6" step="1" value="4"> players
      </label>
      <br>
      <fieldset id="environment-fieldset">
        <legend>environments</legend>
        <div id="environment-checkbox-grid"></div>
      </fieldset>
      <fieldset id="encounter-balance-fieldset">
        <legend>encounter balance</legend>
        <div id="encounter-balance-slider-display"></div>
      </fieldset>
      <div id="difficulty-container">
        <label for="difficulty">difficulty level:
          <input type="range" id="difficulty" name="difficulty" min="1" max="7" step="1" default="4">
        </label>
        <p id="difficulty-description"></p>
      </div>
      <button type="submit" id="submit-button">submit</button>
    </form>
    <script src="script.js"></script>
  </body>
</html>
